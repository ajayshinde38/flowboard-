name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard_ci_password
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://flowboard:flowboard_ci_password@localhost:5432/flowboard_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters-long
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@flowboard/shared

      - name: Generate Prisma client and push schema
        run: |
          npm run db:generate
          npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & integration tests
        run: npm run test

      - name: Production build
        run: npm run build
