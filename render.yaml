services:
  - type: web
    name: flowboard-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build --workspace=@flowboard/shared && npm run db:generate && npm run build --workspace=@flowboard/api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start --workspace=@flowboard/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
